<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reemplazo">
<title>Ruta Reemplazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de terreno, directa, se lee manejando
   IDEA: hoja de ruta + señalética vial
   PICTURE: tarjeta del cliente actual con flecha de dirección y reloj
   COLOUR: grafito, rojo de alerta, verde/ámbar de estado
   TYPE/LAYOUT: Barlow Condensed para cifras y nombres; una columna, botones grandes */
:root{--bg:#11161c;--card:#1a2129;--card2:#222b35;--line:#2e3a46;--ink:#eef2f5;--mut:#9aa8b5;--red:#ef3340;--grn:#27c47a;--amb:#f5a524;--blu:#4aa3ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));overflow-x:clip}
h1,h2,h3,.big{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.05}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}.brands img{width:100%;height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:none}
.top small{display:block;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.s{font-size:14px}
button,.btn{font:600 16px Barlow,sans-serif;border:0;border-radius:12px;min-height:48px;padding:10px 16px;background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.pri{background:var(--red);color:#fff}.ok{background:var(--grn);color:#062b18}.warn{background:var(--amb);color:#2b1a00}
.full{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 0}
.huge{min-height:72px;font-size:21px;border-radius:16px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;font:16px Barlow,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:70px;resize:vertical}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:52px;border:2px solid var(--line);background:var(--bg);font-size:15px;line-height:1.1}
.chip.on{border-color:currentColor}
.e-excelente{color:var(--grn)}.e-normal{color:var(--blu)}.e-mala{color:var(--amb)}.e-nopaga{color:var(--red)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.pay{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:700;font-size:18px;line-height:1.25}
.pay.e-mala{background:#3a2a06;color:#ffd27a}.pay.e-nopaga{background:#3d0d12;color:#ff9aa2}.pay.e-excelente{background:#0b2e1e;color:#8ff0bf}.pay.e-normal{background:#13283d;color:#a9d3ff}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.time{font:700 22px "Barlow Condensed",sans-serif;width:62px;flex:none;white-space:nowrap}
.grow{flex:1}.name{font-weight:700}
.done{opacity:.5}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:99px;transition:width .4s}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stat b{display:block;font:700 26px "Barlow Condensed",sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
.clock{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.clock .big{font-size:52px}
.status{font:700 20px "Barlow Condensed",sans-serif;padding:8px 12px;border-radius:10px;text-align:center}
.st-ok{background:#0b2e1e;color:#8ff0bf}.st-warn{background:#3a2a06;color:#ffd27a}.st-bad{background:#3d0d12;color:#ff9aa2}
.dir{display:flex;align-items:center;gap:14px;margin:12px 0}
.dir svg{width:64px;height:64px;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f13;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{background:none;border-radius:0;min-height:64px;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.nav button.on{color:var(--ink)}.nav svg{width:24px;height:24px}
.nav button.on svg{color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(5,8,11,.82);z-index:20;display:none;align-items:flex-end;justify-content:center;padding:12px}
.ov.show{display:flex}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px;border:1px solid var(--line)}
.alarm .sheet{border:3px solid var(--red);text-align:center;padding:26px 18px}
.alarm h2{font-size:34px;margin-bottom:10px}
.alarm p{font-size:20px;margin:0 0 18px}
.acc{font:700 40px "Barlow Condensed",sans-serif;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}.bar i{transition:none}}
.hide{display:none!important}
.pill{display:inline-block;font:700 14px Barlow,sans-serif;padding:3px 10px;border-radius:99px;white-space:nowrap}
.note{border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#13283d;color:#cfe6ff}
.note.w{background:#3a2a06;color:#ffe2a8}
#cmap{height:62vh;border-radius:12px;overflow:hidden;background:#0b0f13}
.leaflet-popup-content{font:14px/1.35 Barlow,sans-serif;color:#111}
.leaflet-popup-content a{color:#0a58ca}
</style>
</head>

function startWatch(){

}
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b,c,d){const r=x=>x*Math.PI/180;const y=Math.sin(r(d-b))*Math.cos(r(c));const x=Math.cos(r(a))*Math.sin(r(c))-Math.sin(r(a))*Math.cos(r(c))*Math.cos(r(d-b));return (Math.atan2(y,x)*180/Math.PI+360)%360}

function compassOn(){

  else{addEventListener('deviceorientationabsolute',onOrient);addEventListener('deviceorientation',onOrient)}}catch(e){}
}

function gpsHelp(code){
  const ios=/iPhone|iPad/.test(navigator.userAgent);
  if(!isSecureContext)return 'La app está abierta como archivo. El GPS solo funciona abriéndola desde el enlace de GitHub (https://…github.io/…).';

  if(code===1)return ios?'Ubicación bloqueada. En el iPhone: Ajustes → Privacidad y seguridad → Localización (activada) → Safari/Chrome → "Mientras se usa" y "Ubicación exacta" activada. Luego recarga la app.'
    :'Ubicación bloqueada. Toca el candado junto a la dirección en Chrome → Permisos → Ubicación → Permitir. Revisa también que la Ubicación del teléfono esté encendida. Luego recarga la app.';
  if(code===2)return 'El teléfono no entrega ubicación: enciende la Ubicación (GPS) en los ajustes rápidos.';
  return 'Aún sin señal GPS. Sal al aire libre, lejos de techos, y espera unos segundos.';
}
function captureGPS(cb){
  let best=null,id=null,t0=Date.now(),timer=null,fin=false;
  const stop=()=>{fin=true;try{navigator.geolocation.clearWatch(id)}catch(e){}clearInterval(timer)};
  const done=()=>{if(fin)return;stop();closeSheet();cb(best)};
  openSheet(`<h2>Tomando punto GPS</h2><p class="mut s">Quédate quieto en la puerta del cliente. Se toma la mejor lectura posible; no necesita internet.</p>
   <div class="acc" id="gAcc">buscando…</div><p class="s" style="text-align:center" id="gMsg">Precisión (menos es mejor)</p><p class="mut s" style="text-align:center" id="gSec"></p>
   <div class="row"><button id="gCancel">Cancelar</button><button class="pri" id="gUse" disabled>Usar este punto</button></div>
   <button class="full" id="gAdj" style="margin-top:10px" disabled>Ajustar el punto en el mapa</button>
   <div class="row" style="margin-top:10px"><button id="gRetry">Reintentar</button><button id="gSkip">Guardar sin GPS</button></div>`);
  const msg=(t,col)=>{const m=$('#gMsg');if(m){m.textContent=t;m.style.color=col||''}};
  $('#gCancel').onclick=()=>{stop();closeSheet()};
  $('#gUse').onclick=done;
  $('#gAdj').onclick=()=>{if(!best)return;const b0=best;stop();pickOnMap(b0,g=>cb(g?{...g,how:'gps+mapa'}:{...b0,how:'gps'}))};
  $('#gSkip').onclick=()=>{stop();closeSheet();cb(null)};
  $('#gRetry').onclick=()=>{stop();captureGPS(cb)};
  if(!navigator.geolocation||!isSecureContext||window!==window.top){$('#gAcc').textContent='Sin GPS';$('#gAcc').style.color='var(--red)';msg(gpsHelp(0),'var(--amb)');fin=true;return}
  const take=p=>{
    if(fin)return;const c=p.coords;if(!best||c.accuracy<best.acc)best={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),how:'gps'};
    const el=$('#gAcc');if(!el)return;el.textContent='± '+best.acc+' m';
    el.style.color=best.acc<=20?'var(--grn)':best.acc<=50?'var(--amb)':'var(--red)';
    $('#gUse').disabled=false;$('#gAdj').disabled=false;
    msg(best.acc<=20?'Excelente precisión':best.acc<=50?'Aceptable, espera unos segundos para mejorar':'Débil: si estás dentro del local es normal. Puedes usarlo igual, salir a la puerta o ajustarlo en el mapa');
    if(best.acc<=10)done();
  };
  const fail=e=>{if(fin)return;if(e.code===1||e.code===2){stop();$('#gAcc').textContent='Sin GPS';$('#gAcc').style.color='var(--red)';msg(gpsHelp(e.code),'var(--amb)')}else if(!best)msg(gpsHelp(3))};
  if(pos&&pos.latitude!=null)take({coords:pos});
  navigator.geolocation.getCurrentPosition(take,()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:10000});
  id=navigator.geolocation.watchPosition(p=>{pos=p.coords;take(p)},fail,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  timer=setInterval(()=>{if(fin)return;const s=Math.round((Date.now()-t0)/1000);const g=$('#gSec');if(g)g.textContent='Buscando hace '+s+' s';
    if(s>=25&&best)done();else if(s>=20&&!best)msg(gpsHelp(3)+' Si no aparece, usa "Guardar sin GPS" y tómalo después desde Editar.','var(--amb)')},1000);
}

/* ---------- Mapa y Google Maps ---------- */
function parseCoords(s){
  s=decodeURIComponent(String(s||'')).replace(/\s+/g,' ');let m;
  const ok=(a,b)=>{a=+a;b=+b;return Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0)?{lat:a,lng:b,acc:10,how:'pegada'}:null};
  if(m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))return ok(m[1],m[2]);
  if(m=s.match(/[?&](?:q|query|ll|destination|center|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/))return ok(m[1],m[2]);
  if(m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))return ok(m[1],m[2]);
  if(m=s.match(/(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([NS])\s*(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([EWO])/i)){
    const dd=(a,b,c,h)=>(+a+b/60+c/3600)*(/[SWO]/i.test(h)?-1:1);return ok(dd(m[1],m[2],m[3],m[4]),dd(m[5],m[6],m[7],m[8]))}
  if(m=s.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/))return ok(m[1],m[2]);
  return null;
}
let leafletP=null;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  return leafletP=leafletP||new Promise((res,rej)=>{
    const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.append(l);
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=res;s.onerror=()=>{leafletP=null;rej()};document.head.append(s);
  });
}

let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.4,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}
function notify(title,body){
  try{if('Notification' in window&&Notification.permission==='granted'){
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,vibrate:[300,150,300],tag:'ruta'}));
    else new Notification(title,{body});
  }}catch(e){}
}

    else{const n={id:uid(),name,seller:$('#rS').value.trim(),meta,startClock:t?toMin(t):null,clients:[]};S.routes.push(n);S.sel=n.id}
    save();closeSheet();render();
  };
}

  ${rec?'':`<div class="card"><h3>Armar la ruta desde la casa</h3><p class="mut s">Sin salir a terreno: elige cada cliente en el mapa, ponle la hora de pasada y envíale la ruta al reemplazo.</p>
   <label for="hp">Hora de partida de la ruta</label><input id="hp" type="time" value="${hhmm(r.startClock??510)}">
   <button class="pri full" id="addMap" style="margin-top:12px">Agregar cliente eligiendo en el mapa</button>
   <div class="row" style="margin-top:10px"><button id="addMan">Agregar sin ubicación</button><button id="seeMap">Ver ruta en el mapa</button></div>
   ${r.clients.length?'<button class="full" id="sendR" style="margin-top:10px">Enviar esta ruta al reemplazo</button>':''}</div>`}`;
  const nextOff=()=>r.clients.length?r.clients[r.clients.length-1].offset+15:0;
  if(!rec){
    $('#hp').onchange=e=>{if(e.target.value){r.startClock=toMin(e.target.value);save();render()}};
    $('#addMap').onclick=()=>{if(r.startClock==null){r.startClock=toMin($('#hp').value||'08:30');save()}
      const last=[...r.clients].reverse().find(c=>c.lat!=null);
      pickOnMap(last?{lat:last.lat,lng:last.lng}:null,g=>{if(g)editClient(r,null,{...g,offset:nextOff()})})};
    $('#seeMap').onclick=()=>{mfilter='sel';view='mapa';render();scrollTo(0,0)};
    const sr=$('#sendR');if(sr)sr.onclick=()=>exportRoute(r);
  }
  $('#addTel').onclick=()=>editClient(r,null,{tipo:'llamada',offset:rec?Math.max(0,Math.round(nowMin()-r.startClock)):(r.clients.length?r.clients[r.clients.length-1].offset+10:0)});
  if(rec){
    const tick=()=>{const e=$('#elap');if(!e)return;const m=Math.max(0,nowMin()-r.startClock);e.textContent=Math.floor(m/60)+':'+String(Math.floor(m%60)).padStart(2,'0')};tick();
    clearInterval(window._recT);window._recT=setInterval(tick,10000);

  }else{
    $('#go').onclick=()=>{if(!r.clients.length||r.startClock==null)r.startClock=Math.round(nowMin());S.rec={routeId:r.id};save();startWatch();render()};

function editClient(r,c,pre){

  <label>Condición de pago</label><div class="chips">${Object.entries(ESTADOS).map(([k,v])=>`<button class="chip e-${k} ${k===est?'on':''}" data-e="${k}">${v}</button>`).join('')}</div>
  <label for="cAl">Aviso de cobro (sale como alarma)</label><input id="cAl" value="${esc(d.alerta)}" placeholder="Ej: debe pagar factura de $45.000">
  <label for="cT" id="cTl">${tipo==='visita'?'Hora de pasada':'Hora a la que hay que hablarle'}</label><input id="cT" type="time" value="${hhmm(base+(d.offset||0))}">

    <div class="row" style="margin-top:8px"><button id="cMap" class="pri">Elegir en el mapa</button><button id="cGps">${gps.lat!=null?'Volver a tomar GPS':'GPS del teléfono'}</button></div>

    <div class="row" style="margin-top:8px"><a class="btn" id="cFind" href="#">Buscar en Google Maps</a>${gps.lat!=null?`<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${gps.lat},${gps.lng}">Ver punto guardado</a>`:''}</div>
  </div>

    Object.assign(d,{tipo,fono:k.fono.trim(),fantasia:k.fantasia.trim(),rs:k.rs.trim(),atiende:k.atiende.trim(),desc:k.desc.trim(),alerta:k.alerta.trim(),estado:est,offset:Math.max(0,toMin(k.t)-base)});
    if(d.lat!=null&&!d.locAt){d.locBy=S.me||'';d.locAt=Date.now();d.locHow=d.how||'gps'}delete d.how;
    if(!c){d.by=S.me||'';d.created=Date.now();r.clients.push(d)}
    r.clients.sort((a,b)=>a.offset-b.offset);save();closeSheet();render();
  };

/* ---------- Hacer ruta ---------- */
const planOf=(r,c)=>(S.run.base==='mia'?S.run.startMin:(r.startClock??S.run.startMin))+c.offset;
function current(r){const run=S.run;let c=r.clients.find(x=>x.id===run.currentId&&!run.done[x.id]&&!isTel(x));if(!c)c=r.clients.find(x=>!run.done[x.id]&&!isTel(x));return c}
function telCard(r){
  const T=r.clients.filter(isTel);if(!T.length)return'';const run=S.run,n=nowMin();
  return `<div class="card" style="border-color:var(--blu)"><h3>Llamadas y WhatsApp</h3><p class="mut s">${T.filter(x=>!run.done[x.id]).length} pendientes</p><ul class="list">${T.map(x=>{
    const d=run.done[x.id],p=planOf(r,x),late=!d&&n-p>5;
    return `<li class="${d?'done':''}" style="flex-wrap:wrap"><span class="time" style="${late?'color:var(--red)':''}">${hhmm(p)}</span>
    <div class="grow"><div class="name">${esc(x.rs||x.fantasia)}</div><div class="s">${esc(x.fono)} · <span class="tag" style="color:var(--blu)">${TIPOS[x.tipo]}</span> ${d?(d.status==='vendido'?'Vendido '+clp(d.amount):'No compró'):`<span class="tag e-${x.estado}">${ESTADOS[x.estado]}</span>`}${late?' <b style="color:var(--amb)">Pendiente</b>':''}</div>
    ${!d&&(x.alerta||x.estado==='mala'||x.estado==='nopaga')?`<div class="s" style="color:${x.estado==='nopaga'?'#ff9aa2':'#ffd27a'}">${esc(x.alerta||ESTADOS[x.estado])}</div>`:''}</div>
    ${d?'':`<div class="row" style="flex-basis:100%"><a class="btn" href="${esc(telLink(x.fono))}">Llamar</a><a class="btn" style="background:#25d366;color:#05301a" href="https://wa.me/${waNum(x.fono)}">WhatsApp</a><button class="ok" data-tv="${esc(x.id)}">Vendí</button><button data-tn="${esc(x.id)}">No compró</button></div>`}</li>`}).join('')}</ul></div>`;
}
function totals(r){const v=Object.values(S.run.done);return{venta:v.reduce((s,x)=>s+(x.amount||0),0),at:v.length,comp:v.filter(x=>x.status==='vendido').length,n:r.clients.length}}

function vHacer(){
  const run=S.run;
  if(!run){
    const r=route();
    $('#view').innerHTML=r&&r.clients.length?`<div class="card"><h2>${esc(r.name)}</h2><p class="mut">${r.clients.length} clientes · meta del día <b>${clp(r.meta)}</b>${r.startClock!=null?' · partida oficial '+hhmm(r.startClock):''}</p>
      <label for="base">Horario a seguir</label><select id="base"><option value="oficial">Horario del vendedor oficial</option><option value="mia">Desde mi hora de partida</option></select>
      <button class="pri huge full" id="start" style="margin-top:16px">Comenzar ruta</button>
      <p class="mut s">Al comenzar se activan las alarmas, el GPS y la pantalla queda encendida.</p></div>`
     :`<div class="card empty">Elige en <b>Rutas</b> una ruta que ya tenga clientes grabados.</div>`;
    const s=$('#start');if(s)s.onclick=()=>{
      unlockAudio();compassOn();
      try{'Notification' in window&&Notification.permission==='default'&&Notification.requestPermission()}catch(e){}
      S.run={routeId:r.id,date:new Date().toISOString().slice(0,10),startMin:Math.round(nowMin()),base:$('#base').value,done:{},fired:{},currentId:null};
      save();startWatch();keepAwake();render();
    };
    return;
  }
  const r=route(run.routeId);if(!r){S.run=null;save();render();return}
  const c=current(r),t=totals(r),pct=r.meta?Math.min(100,t.venta/r.meta*100):0;
  const L=r.clients.filter(x=>!isTel(x)).map(x=>{const d=run.done[x.id];return `<li class="${d?'done':''}" data-go="${esc(x.id)}"><span class="time">${hhmm(planOf(r,x))}</span>
     <div class="grow"><div class="name">${esc(x.fantasia||x.rs)}</div><div class="s">${d?(d.status==='vendido'?'Vendido '+clp(d.amount):d.status==='nocompro'?'No compró':'Cerrado / no estaba'):`<span class="tag e-${x.estado}">${ESTADOS[x.estado]}</span>`}</div></div>
     ${x===c?'<span class="tag" style="color:var(--red)">Ahora</span>':''}</li>`}).join('');
  $('#view').innerHTML=`
  <div class="card"><div class="stat"><div><b>${clp(t.venta)}</b><span>vendido</span></div><div><b>${clp(r.meta)}</b><span>meta del día</span></div><div><b>${t.at}/${t.n}</b><span>clientes</span></div></div>
    <div class="bar"><i style="width:${pct}%;background:${pct>=100?'var(--grn)':pct>=60?'var(--amb)':'var(--red)'}"></i></div>
    <div class="mut s" style="margin-top:6px">${r.meta?Math.round(t.venta/r.meta*100)+'% de la meta · faltan '+clp(Math.max(0,r.meta-t.venta)):'Sin meta: agrégala en Rutas → Editar datos'}</div></div>
  ${c?`<div class="card" style="border-color:var(--red)">
    <div class="clock"><div><div class="mut s">Cliente actual · debes estar a las</div><div class="big">${hhmm(planOf(r,c))}</div></div><div class="status" id="st">…</div></div>
    <h1 style="margin-top:12px">${esc(c.fantasia||c.rs)}</h1>
    <div class="mut">${esc(c.rs)}${c.atiende?' · Atiende: <b style="color:var(--ink)">'+esc(c.atiende)+'</b>':''}</div>
    <div class="pay e-${c.estado}">${esc(ESTADOS[c.estado])}${c.estado==='mala'?' — cobra antes de vender':''}${c.alerta?'<br>'+esc(c.alerta):''}</div>
    ${c.desc?`<p style="margin:0 0 6px">${esc(c.desc)}</p>`:''}
    <div class="dir"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0b0f13" stroke="#2e3a46" stroke-width="2"/><g id="arrow"><path d="M32 8 L44 44 L32 37 L20 44 Z" fill="#ef3340"/></g></svg>
      <div><div class="big" style="font-size:32px" id="dist">${c.lat!=null?'buscando GPS…':'Sin GPS'}</div><div class="mut s" id="dirTxt"></div></div></div>
    ${c.lat!=null?`<div class="row"><a class="btn" style="background:#33ccff;color:#03222e" href="https://waze.com/ul?ll=${c.lat},${c.lng}&navigate=yes">Waze</a><a class="btn" style="background:#fff;color:#1a1a1a" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving">Google Maps</a></div>`:''}
    <button class="ok huge full" id="sold" style="margin-top:12px">Vendí</button>
    <div class="row" style="margin-top:10px"><button id="noB">No compró</button><button id="clos">Cerrado / no estaba</button></div>
  </div>`:`<div class="card"><h2>Visitas completas</h2><p class="mut">Visitaste todos los clientes de la ruta.</p></div>`}
  ${telCard(r)}
  <div class="card"><h3>Ruta de hoy</h3><p class="mut s">Toca un cliente para atenderlo antes.</p><ul class="list">${L}</ul></div>
  <button class="pri full" id="end">Terminar el día</button>`;
  if(c){
    $('#sold').onclick=()=>{openSheet(`<h2>Venta a ${esc(c.fantasia||c.rs)}</h2><label for="amt">Monto vendido</label><input id="amt" inputmode="numeric" placeholder="Ej: 85000" autofocus>
      <div class="row" style="margin-top:14px"><button id="aX">Cancelar</button><button class="ok" id="aOk">Guardar venta</button></div>`);
      $('#aX').onclick=closeSheet;$('#aOk').onclick=()=>{mark(c,'vendido',Number($('#amt').value.replace(/\D/g,''))||0);closeSheet()}};
    $('#noB').onclick=()=>mark(c,'nocompro',0);$('#clos').onclick=()=>mark(c,'cerrado',0);
  }
  document.querySelectorAll('[data-tn]').forEach(b=>b.onclick=()=>mark({id:b.dataset.tn},'nocompro',0));
  document.querySelectorAll('[data-tv]').forEach(b=>b.onclick=()=>{const x=r.clients.find(y=>y.id===b.dataset.tv);
    openSheet(`<h2>Venta a ${esc(x.rs||x.fantasia)}</h2><label for="amt">Monto vendido</label><input id="amt" inputmode="numeric" placeholder="Ej: 85000">
      <div class="row" style="margin-top:14px"><button id="aX">Cancelar</button><button class="ok" id="aOk">Guardar venta</button></div>`);
    $('#aX').onclick=closeSheet;$('#aOk').onclick=()=>{mark(x,'vendido',Number($('#amt').value.replace(/\D/g,''))||0);closeSheet()}});
  document.querySelectorAll('[data-go]').forEach(li=>li.onclick=()=>{const id=li.dataset.go;if(run.done[id]){if(confirm('¿Volver a dejar pendiente este cliente?')){delete run.done[id];run.currentId=id;save();render()}return}run.currentId=id;save();render();scrollTo(0,0)});
  $('#end').onclick=endDay;
  updateLive();
}
function mark(c,status,amount){const at=Date.now(),la=pos?+pos.latitude.toFixed(6):null,ln=pos?+pos.longitude.toFixed(6):null;
  S.run.done[c.id]={status,amount,at,lat:la,lng:ln};
  const rc=(route(S.run.routeId)?.clients||[]).find(x=>x.id===c.id);if(rc)rc.last={at,by:S.me||'',res:status,lat:la,lng:ln,acc:pos?Math.round(pos.accuracy):null};S.run.currentId=null;save();render();scrollTo(0,0)}

function updateLive(){
  const run=S.run;if(!run||view!=='hacer')return;const r=route(run.routeId);if(!r)return;const c=current(r);if(!c)return;
  const delta=nowMin()-planOf(r,c),st=$('#st');
  if(st){if(delta>5){st.className='status st-bad';st.textContent='+'+Math.round(delta)+' min de la hora'}
    else if(delta>-10){st.className='status st-warn';st.textContent=delta<0?'Faltan '+Math.ceil(-delta)+' min':'Es la hora'}
    else{st.className='status st-ok';st.textContent='A tiempo'}}
  if(pos&&c.lat!=null){
    const d=dist(pos.latitude,pos.longitude,c.lat,c.lng),b=bearing(pos.latitude,pos.longitude,c.lat,c.lng);
    const de=$('#dist');if(de)de.textContent=d<40?'Llegaste':fmtD(d);
    const dt=$('#dirTxt');if(dt)dt.textContent=(heading!=null?'Sigue la flecha':'Hacia el '+cardinal(b)+' (flecha con el norte arriba)')+' · GPS ± '+Math.round(pos.accuracy)+' m';
    const a=$('#arrow');if(a)a.setAttribute('transform',`rotate(${((b-(heading??0))+360)%360} 32 32)`);
  }
}

function checkTel(r){
  const run=S.run,f=run.fired,n=nowMin();
  for(const x of r.clients.filter(isTel)){
    if(run.done[x.id])continue;const p=planOf(r,x),dl=n-p,nm=x.rs||x.fantasia,how=x.tipo==='wsp'?'escribir por WhatsApp a':'llamar a';
    const pago=x.estado==='nopaga'?' Si no paga, no le vendas.':x.estado==='mala'?' Mala paga: cobra antes de vender.':'';
    const extra=' Fono '+x.fono+'.'+pago+(x.alerta?' '+x.alerta:'');
    let k=null,msg=null;
    if(dl>=-5&&dl<0){k='tpre'+x.id;msg=['Llamada en '+Math.ceil(-dl)+' min','A las '+hhmm(p)+' debes '+how+' '+nm+'.'+extra]}
    else if(dl>=0&&dl<5){k='tnow'+x.id;msg=['Es la hora de '+(x.tipo==='wsp'?'escribir':'llamar'),'Ahora debes '+how+' '+nm+'.'+extra]}
    else if(dl>=5){k='tlate'+x.id+'_'+Math.floor((dl-5)/15);msg=['Recordatorio de llamada','Quedó pendiente '+how+' '+nm+' (era a las '+hhmm(p)+').'+extra]}
    if(k&&!f[k]){f[k]=1;save();alarm(msg[0],msg[1],'warn');return true}
  }
  return false;
}
function checkAlarms(){
  const run=S.run;if(!run)return;const r=route(run.routeId);if(!r)return;
  if(checkTel(r))return;
  const c=current(r);if(!c)return;
  const plan=planOf(r,c),delta=nowMin()-plan,f=run.fired,name=c.fantasia||c.rs;let fire=null;
  if(pos&&c.lat!=null&&!f['near'+c.id]&&dist(pos.latitude,pos.longitude,c.lat,c.lng)<=Math.max(70,pos.accuracy)){
    f['near'+c.id]=1;
    if(c.estado!=='normal'||c.alerta)fire=[name+': '+ESTADOS[c.estado],(c.estado==='nopaga'?'Si no paga, NO le vendas. ':c.estado==='mala'?'Mala paga: cobra antes de vender. ':c.estado==='excelente'?'Excelente cliente, atiéndelo bien. ':'')+(c.alerta||'')+(c.atiende?' Atiende: '+c.atiende+'.':''),c.estado==='excelente'?'ok':c.estado==='mala'?'warn':'bad'];
  }
  if(!fire&&delta>=-10&&delta<0&&!f['pre'+c.id]){f['pre'+c.id]=1;fire=['Próximo cliente','Tienes que estar donde '+name+' a las '+hhmm(plan)+'. Faltan '+Math.ceil(-delta)+' min.','warn']}
  if(!fire&&delta>=5){const k='late'+c.id+'_'+Math.floor((delta-5)/15);if(!f[k]){f[k]=1;fire=['Ojo con la hora','Llevas '+Math.round(delta)+' min sobre el horario. El cliente '+name+' suele atenderse a las '+hhmm(plan)+'.','bad']}}
  if(fire){save();alarm(...fire)}
}

async function shareFile(data,name,text,type){
  type=type||'application/json';
  try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name,text:text||''});return true}}
  catch(e){if(e.name==='AbortError')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.append(a);a.click();a.remove();toast('Archivo descargado: envíalo por WhatsApp');return true}
  catch(e){toast('No se pudo crear el archivo');return false}
}
function exportRoute(r){
  shareFile(JSON.stringify({app:'ruta-reemplazo',v:2,route:r}),'ruta-'+slug(r.name)+'.json','Ruta "'+r.name+'": ábrela en la app Ruta Reemplazo → Importar ruta');
}

  if(!S.me){toast('Primero escribe tu nombre en Rutas');view='rutas';render();return}
  if(!S.routes.length){toast('No hay rutas para enviar');return}
  const pkg={app:'ruta-reemplazo',type:'rutas',v:3,who:S.me,sentAt:Date.now(),routes:S.routes.map(r=>({...r,by:r.by||S.me}))};
  const txt='Rutas de '+S.me+': '+S.routes.map(r=>r.name+' ('+r.clients.length+' clientes)').join(', ')+'. Ábrelo en la app Ruta Reemplazo.';
  await shareFile(JSON.stringify(pkg),'rutas-'+slug(S.me)+'-'+today()+'.json',txt);

function importPkg(j){
  if(!j||j.app!=='ruta-reemplazo')throw 0;
  if(j.type==='respaldo'){
    if(!confirm('Esto reemplaza todos los datos de este teléfono por los del respaldo. ¿Continuar?'))return'Restauración cancelada';
    S=Object.assign({routes:[],sel:null,rec:null,run:null,history:[],reports:[],me:''},j.data);return'Respaldo restaurado';
  }
  if(j.type==='rutas'||j.type==='reporte'){
    let nn=0,nu=0;(j.routes||[]).forEach(r=>{if(!r||!Array.isArray(r.clients))return;r.by=r.by||j.who;const i=S.routes.findIndex(x=>x.id===r.id);if(i>=0){S.routes[i]=r;nu++}else{S.routes.push(r);nn++}});
    if(!S.sel&&S.routes[0])S.sel=S.routes[0].id;
    return `${j.who||'Rutas'}: ${nn} nueva(s), ${nu} actualizada(s)`;
  }
  const r=j.route;if(!r||!Array.isArray(r.clients))throw 0;
  const ex=S.routes.findIndex(x=>x.id===r.id);
  if(ex>=0){if(!confirm('Ya tienes la ruta "'+r.name+'". ¿Reemplazarla por la nueva versión?'))return'Sin cambios';S.routes[ex]=r}else S.routes.push(r);
  S.sel=r.id;return 'Ruta "'+r.name+'" importada: '+r.clients.length+' clientes';
}
$('#file').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';const out=[];
  for(const f of fs){try{out.push(importPkg(JSON.parse(await f.text())))}catch(x){out.push(f.name+': archivo no válido')}}
  save();render();toast(out.join(' · '));
};
